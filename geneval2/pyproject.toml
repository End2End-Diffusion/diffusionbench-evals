[project]
name = "geneval2_evaluator"
version = "0.1.0"
description = "Minimal GenEval2 (Soft-TIFA) evaluator for text-to-image generation"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.2",
  "pandas>=2.3",
  "pillow>=12.1",
  "scipy>=1.14",
  "torch>=2.10",
  "torchvision>=0.25",
  "tqdm>=4.67",
  "transformers>=5.3.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["geneval2_evaluator*"]

[tool.setuptools.package-data]
geneval2_evaluator = ["*.jsonl"]
