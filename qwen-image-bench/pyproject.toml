[project]
name = "qwen_image_bench_evaluator"
version = "0.1.0"
description = "Minimal Qwen-Image-Bench evaluator (transformers backend) for text-to-image generation"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
  "accelerate>=1.0",
  "numpy>=2.2",
  "pandas>=2.3",
  "pillow>=12.1",
  "torch>=2.10",
  "torchvision>=0.25",
  "tqdm>=4.67",
  "transformers>=5.3.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["qwen_image_bench_evaluator*"]

[tool.setuptools.package-data]
qwen_image_bench_evaluator = ["metadata/*.json"]
